<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>早押しクイズ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>早押しクイズ</h1>
    <button onclick="location.href='search.html'" class="smallBtn">問題検索</button>
</header>

<div class="container">
    <button id="loadBtn" class="smallBtn">問題集読み込み</button>
    <div id="fileNameDisplay" style="font-size: 0.8em; color: #666; margin-top: 5px;"></div>
    <input type="file" id="fileInput" accept=".csv" style="display:none;">

    <h2 id="question">問題集を読み込んでください</h2>

    <div id="answerSection" style="display:none;">
        <p id="answerText"></p>
        <button id="showAnswerBtn" class="subBtn">解答を表示</button>
        <p id="countdown"></p>
    </div>

    <div id="judgeButtons" style="display:none;">
        <button id="correctBtn" class="judgeBtn correctBtn">正解 (完了)</button>
        <div style="display: flex; justify-content: space-between; width: 100%;">
            <button id="retry1Btn" class="judgeBtn retryBtn" style="background-color: #FF9800; color: white;">1問後に表示</button>
            <button id="retry10Btn" class="judgeBtn retryBtn" style="background-color: #f44336; color: white;">10問後に表示</button>
        </div>
    </div>
</div>

<div id="controlPanel">
    <button id="nextBtn" disabled>次の問題</button>
    <button id="buzzBtn" disabled>早押し！</button>
</div>

<script src="js/script.js"></script>

</body>
</html>
