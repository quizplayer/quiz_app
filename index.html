<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>早押しクイズ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div style="display: flex; gap: 5px; flex-wrap: wrap;">
            <button id="modeTextBtn" class="smallBtn">画面表示</button>
            <button id="modeVoiceBtn" class="smallBtn">音声再生</button>
            <button id="modeAutoBtn" class="smallBtn">自動再生</button>
            <button id="shuffleToggleBtn" class="smallBtn" style="background-color: #9C27B0;">シャッフル: ON</button>
            <button id="openSearchBtn" class="smallBtn">問題検索</button>
        </div>
    </header>

    <div class="container">
        <div style="margin-bottom: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
            <button id="loadBtn" class="smallBtn">問題集読み込み</button>
            <button id="resetBtn" class="smallBtn">リセット</button>
            <div id="startIndexContainer" style="display: flex; align-items: center; gap: 5px; font-size: 0.8em; color: #444;">
                開始: <input type="number" id="startIndexInput" min="1" style="width: 60px; padding: 5px; border-radius: 4px; border: 1px solid #ccc;"> 問目
            </div>
        </div>
        <div id="fileNameDisplay" style="font-size: 0.8em; color: #666; margin-bottom: 5px;"></div>
        <div id="progressDisplay" style="font-size: 0.9em; font-weight: bold; color: #2196F3; margin-bottom: 20px;"></div>
        <input type="file" id="fileInput" accept=".csv" style="display:none;">

        <h2 id="question"></h2>

        <div id="answerSection" style="display:none;">
            <p id="answerText"></p>
            <button id="showAnswerBtn" class="subBtn">解答を表示</button>
            <p id="countdown"></p>
        </div>

        <div id="judgeButtons" style="display:none;">
            <button id="correctBtn" class="judgeBtn correctBtn">正解 (次の問題)</button>
            <div style="display: flex; justify-content: space-between; width: 100%;">
                <button id="retry1Btn" class="judgeBtn retryBtn" style="background-color: #FF9800; color: white;">1問後に出題</button>
                <button id="retry10Btn" class="judgeBtn retryBtn" style="background-color: #f44336; color: white;">10問後に出題</button>
            </div>
        </div>
    </div>

    <div id="controlPanel">
        <button id="nextBtn" disabled>次へ</button>
        <button id="pauseBtn" class="pauseBtn" style="display:none; background-color: #f0ad4e;">一時停止</button>
        <button id="buzzBtn" disabled>早押し！</button>
    </div>

    <div id="searchOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:1000; overflow-y:auto;">
        <div style="position:sticky; top:0; width:100%; background:#f8f8f8; padding:10px; display:flex; gap:10px; align-items:center; border-bottom:1px solid #ccc; box-sizing: border-box;">
            <button id="closeSearchBtn" class="smallBtn" style="background:#555;">閉じる</button>
            <input type="text" id="searchInput" placeholder="問題・答えを検索..." style="flex:1; padding:10px; border-radius:5px; border:1px solid #ccc; font-size:16px;">
        </div>
        <div id="searchResults" style="padding: 20px;"></div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/quizEngine.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
