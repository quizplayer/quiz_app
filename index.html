<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>早押しクイズ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1 style="font-size: 1.1em; margin: 0;">早押しクイズ</h1>
        <button id="menuOpenBtn" style="background: none; border: none; color: #333; font-size: 1.8em; cursor: pointer; padding: 5px;">☰</button>
    </header>

    <div id="sideMenu" class="side-menu">
        <div class="side-menu-header">
            <span>メニュー</span>
            <button id="menuCloseBtn" style="background:none; border:none; font-size:1.8em; cursor:pointer;">&times;</button>
        </div>
        <div class="side-menu-body">
            <section>
                <h4>復習設定</h4>
                <button id="favModeToggleBtn" class="smallBtn" style="width:100%; margin-bottom:10px; background:#FF9800;">☆ 復習モード: OFF</button>
            </section>
            <hr>
            <section>
                <h4>出題モード</h4>
                <div class="mode-buttons-vertical">
                    <button id="modeTextBtn" class="smallBtn">画面表示</button>
                    <button id="modeVoiceBtn" class="smallBtn">音声再生</button>
                    <button id="modeAutoBtn" class="smallBtn">自動再生</button>
                </div>
            </section>
            <hr>
            <section>
                <h4>出題設定</h4>
                <button id="shuffleToggleBtn" class="smallBtn" style="width:100%; margin-bottom:12px;">シャッフル: ON</button>
                <div id="startIndexContainer" style="display: flex; align-items: center; gap: 8px; font-size: 0.9em;">
                    開始位置: <input type="number" id="startIndexInput" min="1" style="width: 70px; padding: 8px; border-radius: 4px; border: 1px solid #ccc;"> 問目
                </div>
            </section>
            <hr>
            <section>
                <h4>データ</h4>
                <button id="loadBtn" class="smallBtn" style="width:100%; margin-bottom:10px; background:#2196F3;">問題集読み込み</button>
                <button id="resetBtn" class="smallBtn" style="width:100%; background:#f44336; margin-bottom:10px;">リセット</button>
                <button id="openSearchBtn" class="smallBtn" style="width:100%; background:#555; margin-bottom:10px;">現在の問題を検索</button>
                <button onclick="window.open('search.html', '_blank')" class="smallBtn" style="width:100%; background:#555;">検索専用ページ</button>
            </section>
        </div>
    </div>
    <div id="menuOverlay" class="menu-overlay"></div>

    <div class="container">
        <div id="fileNameDisplay" style="font-size: 0.8em; color: #666; margin-bottom: 5px;"></div>
        <div id="progressDisplay" style="font-size: 0.9em; font-weight: bold; color: #2196F3; margin-bottom: 20px;"></div>
        <input type="file" id="fileInput" accept=".csv" style="display:none;">

        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;">
            <h2 id="question" style="flex: 1; margin-top: 0;"></h2>
            <button id="favBtn" style="background:none; border:none; font-size: 2.2em; cursor:pointer; padding: 0; color: #ccc; line-height: 1;">☆</button>
        </div>

        <div id="answerSection" style="display:none;">
            <p id="answerText"></p>
            <button id="showAnswerBtn" class="subBtn">解答を表示</button>
            <p id="countdown"></p>
        </div>

        <div id="judgeButtons" style="display:none;">
            <button id="correctBtn" class="judgeBtn correctBtn">正解 (次の問題)</button>
            <div style="display: flex; justify-content: space-between; width: 100%;">
                <button id="retry1Btn" class="judgeBtn retryBtn" style="background-color: #FF9800; color: white;">1問後に出題</button>
                <button id="retry10Btn" class="judgeBtn retryBtn" style="background-color: #f44336; color: white;">10問後に出題</button>
            </div>
        </div>
    </div>

    <div id="controlPanel">
        <button id="nextBtn" disabled>次へ</button>
        <button id="pauseBtn" class="pauseBtn" style="display:none;">一時停止</button>
        <button id="buzzBtn" disabled>早押し！</button>
    </div>

    <div id="searchOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:3000; overflow-y:auto;">
        <div style="position:sticky; top:0; width:100%; background:#f8f8f8; padding:10px; display:flex; gap:10px; align-items:center; border-bottom:1px solid #ccc; box-sizing: border-box;">
            <button id="closeSearchBtn" class="smallBtn" style="background:#555;">閉じる</button>
            <input type="text" id="searchInput" placeholder="問題・答えを検索..." style="flex:1; padding:10px; border-radius:5px; border:1px solid #ccc; font-size:16px;">
        </div>
        <div id="searchResults" style="padding: 20px;"></div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/quizEngine.js"></script>
    <script src="js/audioPlayer.js"></script>
    <script src="js/autoFlowManager.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
